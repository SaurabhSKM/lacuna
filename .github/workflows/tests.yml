name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No API keys or secrets are configured for this job on purpose.
      # The whole suite was built to run offline (fake embeddings, pure
      # scoring/routing functions, a no-API-key failure path), so CI never
      # needs credentials - and a test that quietly started needing a
      # real key would fail here immediately instead of passing locally
      # and breaking later.
      - name: Run offline test suite
        run: pytest tests/ -v
