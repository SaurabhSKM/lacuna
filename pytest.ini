[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    # Several tests deliberately use DeterministicFakeEmbedding, whose
    # vectors aren't unit-normalised, so Chroma's relevance scores land
    # far outside [0,1] and LangChain warns about it. The retriever
    # handles that case explicitly (it fails the relevance gate open),
    # and there's a test asserting it does - so the warning is expected
    # output here, not a problem to be surfaced on every run.
    ignore:Relevance scores must be between:UserWarning
